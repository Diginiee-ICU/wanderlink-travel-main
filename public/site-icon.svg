<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="siteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14323b" />
      <stop offset="100%" stop-color="#091b20" />
    </linearGradient>
    <linearGradient id="siteRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8cd3c7" />
      <stop offset="100%" stop-color="#4a9b9b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#siteBg)" stroke="url(#siteRing)" stroke-width="3" />

  <!-- Globe meridians -->
  <ellipse cx="64" cy="64" rx="42" ry="42" fill="none" stroke="#8cd3c7" stroke-width="2" stroke-opacity="0.35" />
  <ellipse cx="64" cy="64" rx="22" ry="42" fill="none" stroke="#8cd3c7" stroke-width="2" stroke-opacity="0.5" />
  <line x1="22" y1="64" x2="106" y2="64" stroke="#8cd3c7" stroke-width="2" stroke-opacity="0.4" />

  <!-- Compass Star -->
  <path d="M 64 28 L 71 57 L 100 64 L 71 71 L 64 100 L 57 71 L 28 64 L 57 57 Z" fill="#f4ebd9" filter="url(#glow)" />
  <circle cx="64" cy="64" r="5" fill="#14323b" stroke="#8cd3c7" stroke-width="1.5" />
</svg>
